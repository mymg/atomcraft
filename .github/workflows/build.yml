name: Build
on:
  push:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Probe
        run: |
          chmod +x ./gradlew
          ./gradlew compileJava -q
          CP=$(find build ~/.gradle -name "*.jar" | grep -v sources | tr '\n' ':')
          find ~/.gradle -name "curios*.jar" | head
          for c in top.theillusivec4.curios.api.client.ICurioRenderer top.theillusivec4.curios.api.client.CuriosRendererRegistry com.geckolib.renderer.GeoArmorRenderer com.geckolib.renderer.internal.ArmorRenderingHelper net.minecraft.client.renderer.entity.layers.HumanoidArmorLayer net.minecraft.client.renderer.entity.state.HumanoidRenderState net.neoforged.neoforge.event.entity.living.LivingEquipmentChangeEvent net.minecraft.world.item.enchantment.Enchantment net.neoforged.neoforge.event.enchanting.GetEnchantmentLevelEvent net.minecraft.world.item.component.ItemAttributeModifiers net.neoforged.neoforge.event.ItemAttributeModifierEvent; do
            javap -cp "$CP" -protected "$c" > /tmp/out.txt 2>&1 || true
            echo "===== $c"; cat /tmp/out.txt
          done > probe.txt
          cat probe.txt
          for j in $(find ~/.gradle -name "geckolib*.jar" -o -name "curios*.jar" | grep -v sources); do echo JAR $j; unzip -l $j | awk '{print $4}' | grep -iE "armor|curio.*render|client/.*class" | grep -v '[$]' | head -40; done
