name: Build
on:
  push:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Probe
        run: |
          chmod +x ./gradlew
          ./gradlew compileJava -q
          JAR=$(find build ~/.gradle -name "*.jar" | grep -i -E "neoforge.*(merged|minecraft)|minecraft-joined|client-extra" | grep -v sources | head -5)
          echo "$JAR"
          CP=$(find build ~/.gradle -name "*.jar" | grep -v sources | tr '\n' ':')
          for c in net.minecraft.world.level.block.state.BlockBehaviour net.minecraft.world.level.block.state.BlockBehaviour\$BlockStateBase net.minecraft.world.level.block.state.BlockBehaviour\$Properties; do
            javap -cp "$CP" -protected $c > /tmp/out.txt 2>&1 || true
            echo "===== $c"; cat /tmp/out.txt
          done > probe.txt
          cat probe.txt | grep -v "^  private"
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe.txt
