name: Build
on:
  push:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Probe
        run: |
          chmod +x ./gradlew
          ./gradlew compileJava -q
          CP=$(find build ~/.gradle -name "*.jar" | grep -v sources | tr '\n' ':')
          for c in com.geckolib.renderer.GeoItemRenderer com.geckolib.renderer.GeoBlockRenderer net.minecraft.client.gui.GuiGraphicsExtractor net.minecraft.world.level.storage.ValueInput net.minecraft.world.level.storage.ValueOutput net.minecraft.world.level.block.DoublePlantBlock net.minecraft.world.level.block.DoorBlock net.minecraft.world.level.block.state.properties.DoubleBlockHalf net.minecraft.world.level.block.state.BlockBehaviour org.joml.Matrix3x2fStack; do
            javap -cp "$CP" -protected $c > /tmp/out.txt 2>&1 || true
            echo "===== $c"; cat /tmp/out.txt
          done > probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe.txt
