name: Build
on:
  push:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Probe
        run: |
          chmod +x ./gradlew
          ./gradlew compileJava -q
          CP=$(find build ~/.gradle -name "*.jar" | grep -v sources | tr '\n' ':')
          find ~/.gradle -name "curios*.jar" | head
          curl -sL -o /tmp/cfr.jar https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar
          G=$(find ~/.gradle -name "geckolib-neoforge-26.2-5.5.6.jar" | head -1)
          mkdir -p /tmp/dec && cd /tmp/dec && unzip -q -o $G 'com/geckolib/renderer/GeoArmorRenderer*' 'com/geckolib/mixin/client/HumanoidArmorLayerMixin*' 'com/geckolib/renderer/base/GeoRenderer.class'
          java -jar /tmp/cfr.jar com/geckolib/renderer/GeoArmorRenderer.class --silent true > ga.java 2>&1 || true
          java -jar /tmp/cfr.jar com/geckolib/mixin/client/HumanoidArmorLayerMixin.class --silent true > mix.java 2>&1 || true
          java -jar /tmp/cfr.jar com/geckolib/renderer/base/GeoRenderer.class --silent true > gr.java 2>&1 || true
          echo "=== MIXIN"; cat mix.java
          echo "=== ARMOR"; sed -n '/tryRenderGeoArmorPiece/,/^    }/p;/captureRenderStates/,/^    }/p;/record RenderData/,/}/p;/createRenderState/,/^    }/p' ga.java
          echo "=== GEORENDERER"; grep -n "default\|void " gr.java | head -60
