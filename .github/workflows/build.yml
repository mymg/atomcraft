name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: atomcraft-jar
          path: build/libs/*.jar

  # Liga um servidor dedicado com o mod, roda o autoteste e verifica o log.
  server-smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Run server
        env:
          ATOMCRAFT_SELFTEST: "1"
        run: |
          chmod +x ./gradlew
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n' > run/server.properties
          ./gradlew runServer > server.log 2>&1 &
          for i in $(seq 1 120); do
            if grep -q "SELFTEST PASS\|SELFTEST FAIL" server.log && grep -q "Done (" server.log; then break; fi
            if grep -q "BUILD FAILED\|Crash report saved" server.log; then break; fi
            sleep 5
          done
          sleep 3
          pkill -f "net.neoforged" || true
          pkill -f GradleWorkerMain || true
          sleep 3
      - name: Check log
        run: |
          grep "SELFTEST" server.log | sed 's/^.*AtomCraft SELFTEST /::notice title=SELFTEST::/' || true
          grep "valor atômico\|composições base" server.log | sed 's/^.*AtomCraft: /::notice title=Valores::/' || true
          echo "===== Erros ====="
          grep -n -i "exception\|error\|failed to\|couldn't\|could not" server.log | grep -v "DEBUG" | head -60 || true
          grep -q "Done (" server.log || (echo "Servidor não iniciou" && tail -100 server.log && exit 1)
          grep -q "valor atômico" server.log || (echo "Valores atômicos não foram calculados" && exit 1)
          grep -q "SELFTEST PASS" server.log || (echo "Autoteste falhou" && exit 1)
          if grep -i "atomcraft" server.log | grep -v "SELFTEST" | grep -i -q "exception\|error\|failed\|couldn't parse"; then echo "Erros do AtomCraft no log"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-log
          path: server.log
