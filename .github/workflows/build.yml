name: Build
on:
  push:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Probe
        run: |
          chmod +x ./gradlew
          ./gradlew compileJava -q
          JAR=$(find build ~/.gradle -name "*.jar" | grep -i -E "neoforge.*(merged|minecraft)|minecraft-joined|client-extra" | grep -v sources | head -5)
          echo "$JAR"
          CP=$(find build ~/.gradle -name "*.jar" | grep -v sources | tr '\n' ':')
          for c in net.minecraft.client.gui.screens.inventory.AbstractContainerScreen net.minecraft.world.inventory.Slot net.minecraft.client.gui.screens.Screen net.minecraft.world.level.block.entity.BlockEntity net.minecraft.world.level.storage.loot.LootTable net.neoforged.neoforge.event.LootTableLoadEvent net.minecraft.world.level.storage.loot.LootPool net.minecraft.world.level.storage.loot.entries.LootItem net.minecraft.world.level.storage.loot.BuiltInLootTables net.neoforged.neoforge.common.loot.IGlobalLootModifier net.neoforged.neoforge.common.loot.LootModifier; do
            javap -cp "$CP" -public -protected $c > /tmp/out.txt 2>&1 || true
            echo "===== $c"; cat /tmp/out.txt
          done > probe.txt
          grep -c . probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe.txt
