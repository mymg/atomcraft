name: Build
on:
  push:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Probe
        run: |
          chmod +x ./gradlew
          ./gradlew compileJava -q
          CP=$(find build ~/.gradle -name "*.jar" | grep -v sources | tr '\n' ':')
          find ~/.gradle -name "curios*.jar" | head
          for c in 'net.neoforged.neoforge.common.world.chunk.TicketController' 'net.neoforged.neoforge.common.world.chunk.RegisterTicketControllersEvent' 'net.neoforged.neoforge.common.world.chunk.LoadingValidationCallback' 'net.neoforged.neoforge.common.world.chunk.TicketHelper' 'net.minecraft.world.level.ChunkPos'; do
            javap -cp "$CP" -public $c > /tmp/out.txt 2>&1 || true
            echo "===== $c"; grep -v lambda /tmp/out.txt | head -50
          done
