side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
type="required"
versionRange="[5.5,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
type="optional"
versionRange="[16.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[30.0,)"
ordering="NONE"
side="CLIENT"
